
spring.application.name=beautyshop-backend
server.port=8080

# CouchDB
couchdb.url=${COUCHDB_URL:http://127.0.0.1:5984}
couchdb.username=${COUCHDB_USERNAME:admin}
couchdb.password=${COUCHDB_PASSWORD:}
couchdb.database=${COUCHDB_DATABASE:beauty_shop}

# Upload
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Backup
beautyshop.backup.dir=${BEAUTYSHOP_BACKUP_DIR:../../database/backups}
