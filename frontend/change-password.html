
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đổi mật khẩu - BeautyShop</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <main class="login-container">
        <div class="login-card">

            <div class="login-logo">BeautyShop</div>

            <h1>Đổi mật khẩu</h1>

            <p class="login-subtitle">
                Đây là lần đăng nhập đầu tiên.
                Vui lòng đổi mật khẩu trước khi tiếp tục.
            </p>

            <form id="changePasswordForm">

                <div class="form-group">
                    <label for="currentPassword">Mật khẩu hiện tại</label>
                    <input
                        type="password"
                        id="currentPassword"
                        name="currentPassword"
                        placeholder="Nhập mật khẩu hiện tại"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="newPassword">Mật khẩu mới</label>
                    <input
                        type="password"
                        id="newPassword"
                        name="newPassword"
                        placeholder="Nhập mật khẩu mới"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Xác nhận mật khẩu mới</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Nhập lại mật khẩu mới"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >
                </div>

                <p id="changePasswordMessage" aria-live="polite"></p>

                <button type="submit" id="changePasswordButton">
                    Xác nhận đổi mật khẩu
                </button>

            </form>

            <p class="login-footer">
                BeautyShop Management System
            </p>

        </div>
    </main>

    <script src="js/change-password.js"></script>
</body>
</html>
